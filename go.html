<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Janjua Hub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #172554 0%,
                    #090d1a 45%,
                    #03050b 100%
                );

            color: #ffffff;
        }

        .card {

            width: 100%;

            max-width: 460px;

            padding: 42px 28px;

            text-align: center;

            border-radius: 24px;

            background:
                rgba(
                    15,
                    23,
                    42,
                    0.88
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            box-shadow:
                0 30px 80px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

            backdrop-filter:
                blur(16px);
        }

        .logo {

            width: 78px;

            height: 78px;

            margin:
                0 auto 22px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            box-shadow:
                0 0 35px
                rgba(
                    59,
                    130,
                    246,
                    0.35
                );
        }

        h1 {

            margin:
                0 0 10px;

            font-size: 27px;

            letter-spacing:
                0.3px;
        }

        p {

            margin: 0;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.68
                );

            line-height: 1.6;
        }

        .spinner {

            width: 42px;

            height: 42px;

            margin:
                28px auto 20px;

            border-radius: 50%;

            border:
                4px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-top-color:
                #60a5fa;

            animation:
                spin 0.9s
                linear infinite;
        }

        .error {

            margin-top: 24px;

            padding: 14px 16px;

            border-radius: 12px;

            background:
                rgba(
                    239,
                    68,
                    68,
                    0.10
                );

            border:
                1px solid
                rgba(
                    239,
                    68,
                    68,
                    0.25
                );

            color:
                #fecaca;

            font-size: 14px;

            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }

    </style>

</head>


<body>

    <main class="card">

        <div class="logo">
            J
        </div>

        <h1>
            Janjua Hub
        </h1>

        <p id="message">
            Preparing your link...
        </p>

        <div
            id="spinner"
            class="spinner"
        ></div>

        <div
            id="errorBox"
            class="error hidden"
        ></div>

    </main>


    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getFirestore,
            doc,
            getDoc,
            updateDoc,
            increment
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        /* =====================================================
           FIREBASE
        ===================================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyBpGwssnPxdEVJPiMsrhJNSJc_l_Nj8CME",

            authDomain:
                "all-in-one-marketing.firebaseapp.com",

            projectId:
                "all-in-one-marketing",

            storageBucket:
                "all-in-one-marketing.firebasestorage.app",

            messagingSenderId:
                "701353417673",

            appId:
                "1:701353417673:web:84b5cce6029f98b89fa618"
        };


        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getFirestore(
                app
            );


        /* =====================================================
           DOM
        ===================================================== */

        const message =
            document.getElementById(
                "message"
            );

        const spinner =
            document.getElementById(
                "spinner"
            );

        const errorBox =
            document.getElementById(
                "errorBox"
            );


        /* =====================================================
           ERROR
        ===================================================== */

        function showError(text) {

            if (spinner) {

                spinner.classList.add(
                    "hidden"
                );
            }

            if (message) {

                message.textContent =
                    "Link could not be opened.";
            }

            if (errorBox) {

                errorBox.textContent =
                    text;

                errorBox.classList.remove(
                    "hidden"
                );
            }
        }


        /* =====================================================
           READ MARKETING LINK ID
        ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const id =
            params.get("id");


        /* =====================================================
           VALIDATE ID
        ===================================================== */

        if (
            !id ||
            !/^[A-Za-z0-9_-]+$/.test(id)
        ) {

            showError(
                "Invalid marketing link."
            );

        } else {

            redirectToTarget();
        }


        /* =====================================================
           REDIRECT
        ===================================================== */

        async function redirectToTarget() {

            try {

                if (message) {

                    message.textContent =
                        "Preparing your destination...";
                }


                /*
                   ابھی destination URL
                   marketingLinks document
                   سے حاصل کیا جائے گا۔
                */

                const linkRef =
                    doc(
                        db,
                        "marketingLinks",
                        id
                    );


                const linkSnap =
                    await getDoc(
                        linkRef
                    );


                if (
                    !linkSnap.exists()
                ) {

                    showError(
                        "This marketing link does not exist."
                    );

                    return;
                }


                const data =
                    linkSnap.data();


                const targetUrl =
                    String(
                        data.targetUrl ||
                        ""
                    ).trim();


                const status =
                    String(
                        data.status ||
                        "Active"
                    );


                if (!targetUrl) {

                    showError(
                        "Destination URL is missing."
                    );

                    return;
                }


                /* =================================================
                   STATUS CHECK
                ================================================= */

                if (
                    status !==
                    "Active"
                ) {

                    showError(
                        "This marketing link is currently unavailable."
                    );

                    return;
                }


                /* =================================================
                   URL VALIDATION
                ================================================= */

                let destination;

                try {

                    destination =
                        new URL(
                            targetUrl
                        );

                } catch (error) {

                    showError(
                        "Destination URL is invalid."
                    );

                    return;
                }


                if (
                    destination.protocol !==
                        "http:" &&
                    destination.protocol !==
                        "https:"
                ) {

                    showError(
                        "Destination URL is not allowed."
                    );

                    return;
                }


                /* =================================================
                   CLICK COUNT
                ================================================= */

                try {

                    await updateDoc(
                        linkRef,
                        {
                            clicks:
                                increment(1)
                        }
                    );

                } catch (trackingError) {

                    console.warn(
                        "Click tracking failed:",
                        trackingError
                    );

                }


                /* =================================================
                   REDIRECT
                ================================================= */

                if (message) {

                    message.textContent =
                        "Redirecting...";
                }


                window.location.replace(
                    destination.toString()
                );


            } catch (error) {

                console.error(
                    "Marketing Redirect Error:",
                    error
                );

                showError(
                    "Unable to open this marketing link right now."
                );
            }
        }

    </script>

</body>

</html>
